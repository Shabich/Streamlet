<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root { --fond: #ffffff; --texte: #111827; --doux: #6b7280; --bord: #e5e7eb; --carte: #f9fafb;
          --ok: #16a34a; --ko: #dc2626; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #18181b; --texte: #f4f4f5; --doux: #a1a1aa; --bord: #3f3f46; --carte: #27272a; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* sinon #carte { display: flex } annule l attribut hidden */
  body { margin: 0; width: 320px; padding: 14px; font: 13px/1.4 -apple-system, system-ui, sans-serif;
         background: var(--fond); color: var(--texte); }
  .marque { display: flex; align-items: center; gap: 8px; }
  .marque img { width: 20px; height: 20px; border-radius: 5px; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .serveur { font-size: 11px; font-weight: normal; color: var(--doux); display: flex; gap: 6px; align-items: center; }
  .point { width: 8px; height: 8px; border-radius: 50%; background: var(--doux); }
  .point.ok { background: var(--ok); } .point.ko { background: var(--ko); }
  .interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                  padding: 10px; border: 1px solid var(--bord); border-radius: 8px; cursor: pointer; }
  .site { color: var(--doux); font-size: 11px; word-break: break-all; }
  input[type=checkbox] { appearance: none; width: 36px; height: 20px; border-radius: 10px; background: var(--bord);
                         position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                                border-radius: 50%; background: #fff; transition: left .15s; }
  input[type=checkbox]:checked { background: var(--ok); }
  input[type=checkbox]:checked::after { left: 18px; }
  input[type=checkbox]:disabled { opacity: .4; cursor: not-allowed; }
  .msg { margin-top: 8px; font-size: 12px; color: var(--ko); min-height: 0; }
  .carte { margin-top: 10px; padding: 10px; background: var(--carte); border-radius: 8px; }
  .etiquette { font-size: 11px; color: var(--doux); text-transform: uppercase; letter-spacing: .04em; }
  .question { margin: 2px 0 0; font-weight: 600; }
  .indice { margin-top: 2px; }
  .encours { color: var(--accent); font-size: 12px; margin-top: 6px; }
  .pied { margin-top: 10px; font-size: 11px; color: var(--doux); }
  .section { margin-top: 12px; }
  .segments { display: flex; margin-top: 4px; border: 1px solid var(--bord); border-radius: 8px; overflow: hidden; }
  .segments button { flex: 1; padding: 6px 0; border: 0; background: transparent; color: var(--texte);
                     font: inherit; cursor: pointer; }
  .segments button + button { border-left: 1px solid var(--bord); }
  .segments button.choisi { background: var(--accent); color: #fff; }
  .aide { font-size: 11px; color: var(--doux); margin-top: 4px; }
  .claude { margin-top: 8px; padding: 10px; border: 1px solid var(--bord); border-radius: 8px; }
  .claude .segments { margin-top: 8px; }
  .affichage { display: flex; gap: 14px; margin-top: 10px; }
  .note { font-size: 11px; color: var(--doux); margin-top: 8px; }
  .petit-inter { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .petit-inter input[type=checkbox] { width: 28px; height: 16px; border-radius: 8px; }
  .petit-inter input[type=checkbox]::after { width: 12px; height: 12px; }
  .petit-inter input[type=checkbox]:checked::after { left: 14px; }
  #carte { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
  #carte .carte { margin-top: 0; }
  .bloc { margin-top: 6px; }
  .reponse { font-weight: 600; color: var(--ok); }
  .ligne { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .connexion { display: flex; gap: 6px; margin-top: 8px; }
  .connexion input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--bord); border-radius: 6px;
                     background: var(--fond); color: var(--texte); font: inherit; }
  .bouton { padding: 6px 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
            font: inherit; cursor: pointer; }
  .bouton.discret { background: transparent; color: var(--doux); border: 1px solid var(--bord); }
  .bouton:disabled { opacity: .5; cursor: default; }
  a { color: var(--accent); }
  .ok { color: var(--ok); } .ko { color: var(--ko); }
</style>
</head>
<body>
  <h1><span class="marque"><img src="icons/icon-32.png" alt="">Streamlet</span> <span class="serveur"><span class="point" id="point"></span><span id="serveur">serveur…</span></span></h1>

  <label class="interrupteur">
    <div>
      <div>Streamer cette page</div>
      <div class="site" id="site"></div>
    </div>
    <input type="checkbox" id="actif">
  </label>
  <div class="msg" id="msg"></div>

  <div class="section">
    <div class="etiquette">Moteur</div>
    <div class="segments" id="modes">
      <button data-mode="local">Local</button>
      <button data-mode="auto">Auto</button>
      <button data-mode="claude">En ligne</button>
    </div>
    <div class="aide" id="aide-mode"></div>

    <div class="claude">
      <div class="ligne">
        <span>Claude</span>
        <span id="claude-etat">…</span>
      </div>
      <div class="segments" id="acces">
        <button data-acces="abonnement">Abonnement</button>
        <button data-acces="api">Clé API</button>
      </div>
      <div class="segments" id="modeles" title="Modèle Claude utilisé">
        <button data-modele="haiku">Haiku</button>
        <button data-modele="sonnet">Sonnet</button>
        <button data-modele="opus">Opus</button>
      </div>
      <div class="aide" id="aide-modele"></div>
      <div class="aide" id="claude-abonnement" hidden></div>
      <div id="claude-deconnecte" hidden>
        <form class="connexion" id="form-claude">
          <input type="password" id="cle" placeholder="Clé API (sk-ant-…)" autocomplete="off">
          <button class="bouton" type="submit" id="btn-connexion">Connecter</button>
        </form>
        <div class="aide">Crée une clé sur <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>.
          Elle est rangée dans le trousseau du système, pas dans l'extension.</div>
      </div>
      <div id="claude-connecte" hidden>
        <div class="ligne aide"><span id="claude-cout"></span>
          <button class="bouton discret" id="btn-deconnexion">Déconnecter</button></div>
      </div>
      <div class="msg" id="msg-claude"></div>
    </div>
  </div>

  <div class="affichage">
    <label class="petit-inter"><input type="checkbox" id="voir-notif"> Notification sur la page</label>
  </div>
  <div class="affichage">
    <label class="petit-inter"><input type="checkbox" id="voir-indice"> Afficher l'indice</label>
    <label class="petit-inter"><input type="checkbox" id="voir-reponse"> Afficher la réponse</label>
  </div>

  <div class="affichage">
    <label class="petit-inter"><input type="checkbox" id="capture-auto"> Capturer les images illisibles</label>
  </div>
  <div class="aide" id="aide-capture"></div>
  <div class="note" id="note-notif" hidden>Les résultats s'affichent sur la page, en bas à droite.</div>
  <div class="encours" id="encours" hidden></div>
  <div id="carte" hidden></div>

  <div class="pied" id="pied"></div>
  <script src="popup.js"></script>
</body>
</html>
